    <!-- No maximum-scale: locking zoom fails WCAG 2.1 SC 1.4.4 and takes
         pinch-zoom away from exactly the low-vision customers who need it.
         iOS focus-zoom, the usual reason people add it, is prevented
         properly in global.css by giving inputs a 16px font on touch
         devices instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nari & Kāge · Order</title>

    <!-- Favicons (bump ?v= when icon files change to bust caches) -->

    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=10" />

    <!-- Preload the texture so the bridge splash paints fully on PWA launch. -->

    <!-- Google Fonts, three families for the 2b type system:
         - DM Mono (body labels, descriptions, provenance, tags)
         - Bricolage Grotesque (drawer nav primary links, per brief)
         - Hanken Grotesk (base UI sans, longer running text)
         Preconnect first for faster handshake, then swap-load so text
         paints in a fallback while fonts arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Weight 300 is requested because the CSS asks for it: every form
         field is font-weight 300 (global.css), plus ten other rules. It was
         missing from this list, so the browser faked a light weight from 400
         in all eleven places.

         Loaded without blocking render. media="print" makes the browser
         fetch the sheet at low priority and not hold first paint for it;
         onload flips it to all once it arrives. The preload above starts the
         fetch immediately so the swap happens sooner, and the noscript copy
         covers JavaScript being off. display=swap already meant text painted
         in a fallback, but the stylesheet itself still blocked the first
         paint of everything else. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:wght@400;500;600&family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:wght@400;500;600&family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:wght@400;500;600&family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>

    <style>
      /* Bridge splash for installed PWAs: covers the gap between the OS
         native launch screen and React mounting (which renders its own
         <SplashScreen> with the rotating brand mark). Uses the SAME
         cream + paper texture as the React splash so the two read as
         one continuous splash, previously this was a red screen with a
         different image, which flashed visibly before the React layer
         covered it. */
      #app-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #F5EFE3;
        background-image: url('/bg-texture.jpg');
        background-blend-mode: multiply;
        background-repeat: repeat;
        background-size: 512px 512px;
        opacity: 1;
        transition: opacity 0.4s ease-out;
      }
      @media (display-mode: standalone) {
        #app-splash { display: block; }
      }
      #app-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
