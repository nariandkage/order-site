<?xml version="1.0" encoding="UTF-8"?>
<!--
  Circle-optimised variant of iconapp-nk.svg.

  Identical artwork (same cream gradient background, same red wordmark) but
  with a tighter viewBox so the wordmark fills ~82% of the canvas instead
  of ~78%. This is the maximum we can safely push without risking that the
  wordmark's outer pixels get clipped by an Android adaptive-icon circular
  mask (the inscribed circle in the canvas has radius = canvas/2; the
  farthest inked pixel sits at ~475 from the wordmark centre, so canvas
  must be >= ~950 for safety).

  Used by the maskable PNGs in the manifest. The original iconapp-nk.svg
  is kept around for the "any" purpose icons where launchers don't apply
  a mask.
-->
